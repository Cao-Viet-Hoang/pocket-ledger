<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="Pocket Ledger — Personal finance, receivables and debts in one place." />
  <title>Pocket Ledger</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="apple-touch-icon" href="apple-touch-icon.svg" />

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@600;700;800&display=swap"
    rel="stylesheet"
  />

  <link rel="stylesheet" href="css/variables.css" />
  <link rel="stylesheet" href="css/base.css" />
  <link rel="stylesheet" href="css/components.css" />
  <link rel="stylesheet" href="css/layout.css" />
  <link rel="stylesheet" href="css/pages.css" />
</head>
<body>
  <div id="app" class="app-shell">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-brand">
        <span class="brand-mark" data-icon="wallet"></span>
        <div class="brand-text">
          <span class="brand-name">Pocket Ledger</span>
          <span class="brand-tagline" data-i18n="brand.tagline">Smart personal finance</span>
        </div>
      </div>

      <nav class="sidebar-nav" id="sidebar-nav">
        <a class="nav-item" data-route="dashboard" href="#/dashboard">
          <span class="nav-icon" data-icon="dashboard"></span>
          <span class="nav-label" data-i18n="nav.dashboard">Dashboard</span>
        </a>
        <a class="nav-item" data-route="transactions" href="#/transactions">
          <span class="nav-icon" data-icon="exchange"></span>
          <span class="nav-label" data-i18n="nav.transactions">Transactions</span>
        </a>
        <a class="nav-item" data-route="lending" href="#/lending">
          <span class="nav-icon" data-icon="hand-coin"></span>
          <span class="nav-label" data-i18n="nav.lending">Lending</span>
        </a>
        <a class="nav-item" data-route="borrowing" href="#/borrowing">
          <span class="nav-icon" data-icon="hand-receive"></span>
          <span class="nav-label" data-i18n="nav.borrowing">Borrowing</span>
        </a>
        <a class="nav-item" data-route="people" href="#/people">
          <span class="nav-icon" data-icon="people"></span>
          <span class="nav-label" data-i18n="nav.people">People</span>
        </a>
        <a class="nav-item" data-route="reports" href="#/reports">
          <span class="nav-icon" data-icon="chart"></span>
          <span class="nav-label" data-i18n="nav.reports">Reports</span>
        </a>
      </nav>

      <div class="sidebar-footer">
        <div class="user-badge" id="userBadge" style="display:none">
          <span class="user-avatar" data-icon="user"></span>
          <span class="user-info">
            <span class="user-label" data-i18n="setup.connectedAs">Signed in as</span>
            <span class="user-name"></span>
          </span>
        </div>
        <div class="footer-actions">
          <button type="button" class="btn btn-ghost btn-sm" id="configureBtn" title="Configure Firebase">
            <span data-icon="edit"></span>
            <span data-i18n="action.configure">Configure</span>
          </button>
          <button type="button" class="btn btn-ghost btn-sm" id="disconnectBtn" title="Disconnect">
            <span data-icon="close"></span>
            <span data-i18n="setup.disconnect">Disconnect</span>
          </button>
        </div>
        <div class="language-switcher" role="group" aria-label="Language">
          <button type="button" class="lang-btn" data-lang="en">EN</button>
          <button type="button" class="lang-btn" data-lang="vi">VI</button>
        </div>
      </div>
    </aside>

    <div class="main-wrapper">
      <header class="topbar">
        <button type="button" class="icon-btn topbar-menu" id="sidebarToggle" aria-label="Toggle navigation">
          <span data-icon="menu"></span>
        </button>

        <div class="topbar-title">
          <h1 id="pageTitle" data-i18n="nav.dashboard">Dashboard</h1>
          <p id="pageSubtitle" class="topbar-subtitle" data-i18n="page.dashboard.subtitle">
            Your financial snapshot at a glance
          </p>
        </div>

        <div class="topbar-actions">
          <button type="button" class="btn btn-ghost icon-only" aria-label="Search">
            <span data-icon="search"></span>
          </button>
          <button type="button" class="btn btn-ghost icon-only" aria-label="Notifications">
            <span data-icon="bell"></span>
          </button>
          <button type="button" class="btn btn-primary" id="quickAddBtn">
            <span data-icon="plus"></span>
            <span data-i18n="action.add">Add</span>
          </button>
        </div>
      </header>

      <main class="content" id="content">
        <!-- Pages are rendered here -->
      </main>

      <nav class="mobile-tabbar" id="mobileTabbar">
        <a class="tab-item" data-route="dashboard" href="#/dashboard">
          <span data-icon="dashboard"></span>
          <span data-i18n="nav.dashboard">Dashboard</span>
        </a>
        <a class="tab-item" data-route="transactions" href="#/transactions">
          <span data-icon="exchange"></span>
          <span data-i18n="nav.transactions">Transactions</span>
        </a>
        <a class="tab-item tab-add" data-action="quick-add" href="#add">
          <span data-icon="plus"></span>
        </a>
        <a class="tab-item" data-route="lending" href="#/lending">
          <span data-icon="hand-coin"></span>
          <span data-i18n="nav.lending">Lending</span>
        </a>
        <a class="tab-item" data-route="reports" href="#/reports">
          <span data-icon="chart"></span>
          <span data-i18n="nav.reports">Reports</span>
        </a>
      </nav>
    </div>
  </div>

  <div class="sidebar-backdrop" id="sidebarBackdrop" aria-hidden="true"></div>
  <div class="modal-root" id="modalRoot" aria-hidden="true"></div>
  <div class="toast-root" id="toastRoot" aria-live="polite"></div>

  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>

  <script src="js/icons.js"></script>
  <script src="js/formatters.js"></script>
  <script src="js/i18n.js"></script>
  <script src="js/firebase-client.js"></script>
  <script src="js/store.js"></script>
  <script src="js/components/modal.js"></script>
  <script src="js/components/forms.js"></script>
  <script src="js/components/charts.js"></script>
  <script src="js/components/loan-view.js"></script>
  <script src="js/pages/dashboard.js"></script>
  <script src="js/pages/transactions.js"></script>
  <script src="js/pages/lending.js"></script>
  <script src="js/pages/borrowing.js"></script>
  <script src="js/pages/people.js"></script>
  <script src="js/pages/reports.js"></script>
  <script src="js/setup.js"></script>
  <script src="js/router.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
